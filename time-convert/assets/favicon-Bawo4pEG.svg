<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#4A90D9" stroke="#2C5F8A" stroke-width="3"/>

  <!-- Clock face -->
  <circle cx="50" cy="50" r="28" fill="white" stroke="#2C5F8A" stroke-width="2.5"/>

  <!-- Clock hands -->
  <!-- Hour hand -->
  <line x1="50" y1="50" x2="50" y2="32" stroke="#2C5F8A" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="50" y1="50" x2="64" y2="50" stroke="#E85D3A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#2C5F8A"/>

  <!-- Clock tick marks -->
  <line x1="50" y1="24" x2="50" y2="28" stroke="#2C5F8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="72" x2="50" y2="76" stroke="#2C5F8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="50" x2="28" y2="50" stroke="#2C5F8A" stroke-width="2" stroke-linecap="round"/>
  <line x1="72" y1="50" x2="76" y2="50" stroke="#2C5F8A" stroke-width="2" stroke-linecap="round"/>

  <!-- Conversion arrows around the clock -->
  <!-- Right arrow (clockwise) -->
  <path d="M 62 22 A 30 30 0 0 1 78 38" fill="none" stroke="#E85D3A" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="78,35 82,41 74,41" fill="#E85D3A"/>

  <!-- Left arrow (counter-clockwise) -->
  <path d="M 38 78 A 30 30 0 0 1 22 62" fill="none" stroke="#E85D3A" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="22,65 18,59 26,59" fill="#E85D3A"/>

  <!-- Small timezone dots -->
  <circle cx="50" cy="16" r="2.5" fill="#FFB347" stroke="#2C5F8A" stroke-width="1"/>
  <circle cx="50" cy="84" r="2.5" fill="#FFB347" stroke="#2C5F8A" stroke-width="1"/>
  <circle cx="16" cy="50" r="2.5" fill="#FFB347" stroke="#2C5F8A" stroke-width="1"/>
  <circle cx="84" cy="50" r="2.5" fill="#FFB347" stroke="#2C5F8A" stroke-width="1"/>
</svg>