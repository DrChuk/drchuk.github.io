<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="temp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#f44336"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Термометр: трубка -->
  <rect x="56" y="24" width="16" height="62" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="60" y="30" width="8" height="54" rx="4" fill="url(#temp)"/>

  <!-- Колба -->
  <circle cx="64" cy="94" r="16" fill="#ffffff"/>
  <circle cx="64" cy="94" r="11" fill="#f44336"/>

  <!-- Деления -->
  <line x1="74" y1="40" x2="80" y2="40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="52" x2="80" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="64" x2="80" y2="64" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Символы °C / °F -->
  <text x="88" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">°C</text>
  <text x="18" y="108" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">°F</text>
</svg>